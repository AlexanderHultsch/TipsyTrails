<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values in an installed iOS PWA rather than 0px. Without it the bottom
         tab bar's --bottom-nav-inset token (index.css) never receives the
         home-indicator's actual height, so the bar sits flush against the
         bottom edge with no clearance - the defect this line fixes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tipsy Trails</title>
    <meta
      name="description"
      content="A location-based exploration game for Karlsruhe. Walk to clear the fog, discover bars, and master them."
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4efe6" />
    <!-- iOS ignores most of manifest.json (SPEC.md Section 12, Phase 8 task
         brief) - install-to-home-screen there needs its own meta tags and a
         dedicated, non-transparent touch icon rather than the manifest's. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tipsy Trails" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
